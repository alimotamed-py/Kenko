services:

# =========================== BackEnd ===========================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kenko_api

    restart: unless-stopped

    ports:
      - "8002:8000"

    environment:
      # Application
      APP_NAME: ${APP_NAME:-Kenko}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRET_KEY: ${SECRET_KEY}

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-kenko_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kenko_db}

      DATABASE_URL: postgresql://${POSTGRES_USER:-kenko_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kenko_db}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      REDIS_URL: redis://redis:6379/0

    volumes:
      - app_logs:/app/logs

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - kenko_network

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

# =========================== PostgreSQL ===========================
  postgres:
    image: postgres:18-alpine

    container_name: kenko_postgres

    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kenko_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kenko_db}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - kenko_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kenko_user} -d ${POSTGRES_DB:-kenko_db}"
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

# =========================== Redis ===========================
  redis:
    image: redis:latest

    container_name: kenko_redis

    restart: unless-stopped

    ports:
      - "6380:6379"

    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis_data:/data

    networks:
      - kenko_network

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

# =========================== Volumes ===========================
volumes:

  postgres_data:
    driver: local

  redis_data:
    driver: local

  app_logs:
    driver: local

# =========================== Network ===========================
networks:

  kenko_network:
    driver: bridge